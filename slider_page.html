<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  body { margin:0; font-family:'Malgun Gothic','맑은 고딕',sans-serif; }
  .slider { position:relative; width:100%; max-width:720px; margin:0 auto; overflow:hidden; border-radius:8px; }
  .slides { display:flex; transition:transform 0.4s ease; }
  .slides img { width:100%; flex:0 0 100%; display:block; }
  .dots { text-align:center; padding:10px 0; }
  .dots span { display:inline-block; width:9px; height:9px; border-radius:50%; background:#bcd9f0; margin:0 4px; cursor:pointer; }
  .dots span.active { background:#3498db; }
</style>
</head>
<body>

<div class="slider">
  <div class="slides" id="slides">
    <img src="pic1.JPG">
    <img src="pic2.JPG">
    <img src="pic3.JPG">
  </div>
</div>
<div class="dots" id="dots">
  <span onclick="goTo(0)" class="active"></span>
  <span onclick="goTo(1)"></span>
  <span onclick="goTo(2)"></span>
</div>

<script>
  let idx = 0;
  const total = 3;
  const slidesEl = document.getElementById('slides');
  const dotEls = document.querySelectorAll('.dots span');

  function goTo(i) {
    idx = i;
    slidesEl.style.transform = 'translateX(-' + (idx * 100) + '%)';
    dotEls.forEach((d, n) => d.classList.toggle('active', n === idx));
  }

  setInterval(() => { goTo((idx + 1) % total); }, 4000);
</script>

</body>
</html>
